version: '3.8'

services:
  heart-disease-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: heart_disease_app
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
      - ../app:/app/app
      - ../src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
